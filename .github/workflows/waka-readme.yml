name: Waka Readme

on:
  schedule:
    - cron: "0 18 * * *"  # 每天台灣時間 02:00 更新 (UTC+8)
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          UPDATED_DATE_FORMAT: "%Y-%m-%d %H:%M:%S"
          COMMIT_MESSAGE: "docs(readme): update wakatime metrics"
          DEBUG_LOGGING: true
          # 要翻遍所有 commit 才算得出來，很慢，而且算法不準，關掉
          SHOW_LINES_OF_CODE: false
          SHOW_LOC_CHART: false
          SHOW_COMMIT: false
          SHOW_DAYS_OF_WEEK: false
          # 算的是這個 repo 頁面的瀏覽數，不是個人頁
          SHOW_PROFILE_VIEWS: false
          # 語言以 WakaTime 的時間為準，不數 repo
          SHOW_LANGUAGE_PER_REPO: false
          SHOW_AI_CODE_TIME: true
          SHOW_AI_CODING: true
